[package]
name = "scrivener"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-stream = "0.1"
futures = "0.3"
# PipeWire bindings
pipewire = "0.10"
pipewire-sys = "0.10"
libspa-sys = "0.10"
# Audio utilities
# cpal = "0.16" # removed to avoid ALSA dependency in build environment
base64 = "0.22"
fastrand = "2"
inquire = "0.7"
toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }
hound = "3.5"

